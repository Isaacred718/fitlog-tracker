<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f0a">
<title>Your sign-in code</title>
<style>
  html,body{margin:0;min-height:100%;background:#0a0f0a;color:#e8f5e8;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  main{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{max-width:26rem;width:100%}
  h1{font-size:1.15rem;margin:0 0 8px}
  p{color:#8cb88c;margin:8px 0}
  ol{color:#cfe8cf;padding-left:20px;margin:10px 0}
  textarea{width:100%;box-sizing:border-box;min-height:110px;border-radius:10px;border:1px solid #2c4a2c;
    background:#0f1a0f;color:#e8f5e8;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all}
  button{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;
    background:#8cf23a;color:#0a0f0a;font-weight:700;font-size:16px}
  button.secondary{background:none;border:1px solid #2c4a2c;color:#8cf23a;font-weight:600;font-size:14px}
  a{color:#8cf23a}
  .warn{color:#f2c85c;font-size:13px}
</style>
</head>
<body>
<main><div class="card" id="card"><p id="msg">Signing you in…</p></div></main>
<script>
(function () {
  var msg = document.getElementById("msg");
  var card = document.getElementById("card");
  function goHome() { location.replace("index.html"); }
  function b64urlEncode(str) {
    return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function tokenExpiryText(idToken) {
    try {
      var part = idToken.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      var payload = JSON.parse(decodeURIComponent(escape(atob(part))));
      if (payload && payload.exp) {
        var mins = Math.max(0, Math.round((payload.exp * 1000 - Date.now()) / 60000));
        return "This code works for about " + mins + " more minute" + (mins === 1 ? "" : "s") + ".";
      }
    } catch (e) {}
    return "This code works for about an hour.";
  }
  try {
    var hash = (location.hash || "").replace(/^#/, "");
    var q = new URLSearchParams(location.search);
    var params = new URLSearchParams(hash);
    var err = params.get("error") || q.get("error");
    var idToken = params.get("id_token");
    var stateParam = params.get("state") || "";
    if (err) {
      msg.textContent = err === "access_denied"
        ? "Sign-in was cancelled. Returning…"
        : "Google sign-in failed (" + err + "). Returning…";
      setTimeout(goHome, 1400);
      return;
    }
    if (idToken) {
      // Keep the Safari-side copy too, so "Continue in Safari" still works.
      try { localStorage.setItem("liftTrackerGoogleIdToken", idToken); } catch (e) {}
      var code = "LT1." + b64urlEncode(JSON.stringify({ t: idToken, s: stateParam }));
      card.innerHTML = "";
      var h = document.createElement("h1"); h.textContent = "You are signed in to Google ✓";
      var intro = document.createElement("p");
      intro.textContent = "iPhone keeps the home-screen app's storage separate from Safari, so the sign-in cannot jump back on its own. Carry it over with this code:";
      var steps = document.createElement("ol");
      steps.innerHTML = "<li>Tap <b>Copy code</b> below</li><li>Switch back to the <b>Lift Tracker</b> home-screen app</li><li>Tap <b>Paste sign-in code</b> in Settings and paste it in</li>";
      var ta = document.createElement("textarea");
      ta.id = "sign-code"; ta.readOnly = true; ta.value = code; ta.setAttribute("aria-label", "Sign-in code");
      var copyBtn = document.createElement("button"); copyBtn.textContent = "Copy code";
      copyBtn.addEventListener("click", function () {
        ta.focus(); ta.select(); ta.setSelectionRange(0, code.length);
        function done() { copyBtn.textContent = "Copied ✓ Now switch to Lift Tracker"; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done, function () {
            try { document.execCommand("copy"); } catch (e) {}
            done();
          });
        } else {
          try { document.execCommand("copy"); } catch (e) {}
          done();
        }
      });
      var exp = document.createElement("p"); exp.className = "warn"; exp.textContent = tokenExpiryText(idToken);
      var safariBtn = document.createElement("button");
      safariBtn.className = "secondary"; safariBtn.textContent = "Or just continue in Safari instead";
      safariBtn.addEventListener("click", goHome);
      card.appendChild(h); card.appendChild(intro); card.appendChild(steps);
      card.appendChild(ta); card.appendChild(copyBtn); card.appendChild(exp); card.appendChild(safariBtn);
      return;
    }
    msg.innerHTML = "No sign-in data. <a href=\"index.html\">Back to Lift Tracker</a>";
    setTimeout(goHome, 1200);
  } catch (e) {
    msg.textContent = "Sign-in error. Returning…";
    setTimeout(goHome, 1200);
  }
})();
</script>
</body>
</html>
